<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IELTS Start</title>

<style>
body {
  font-family: Arial;
  background: #f5f7fb;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.card {
  background: white;
  padding: 30px;
  border-radius: 10px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  width: 350px;
}

input {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 15px;
  background: #0a1f44;
  color: white;
  border: none;
  cursor: pointer;
}
</style>

</head>
<body>

<div class="card">
  <h2>IELTS Mock Test</h2>

  <input id="name" placeholder="Enter Name">
  <input id="surname" placeholder="Enter Surname">

  <button onclick="start()">Start</button>
</div>

<script>
function start() {
  const name = document.getElementById("name").value;
  const surname = document.getElementById("surname").value;

  localStorage.setItem("name", name);
  localStorage.setItem("surname", surname);

  window.location.href = "instructions.html";
}
</script>

</body>
</html>
