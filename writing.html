<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Writing Test</title>

<style>
body {
  font-family: Arial;
  background: #f5f7fb;
  display: flex;
  justify-content: center;
  padding: 30px;
}

.card {
  background: white;
  padding: 30px;
  border-radius: 10px;
  width: 700px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

textarea {
  width: 100%;
  height: 200px;
  padding: 10px;
  margin-top: 10px;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 15px;
  background: #0a1f44;
  color: white;
  border: none;
  cursor: pointer;
}
</style>

</head>
<body>

<div class="card">
  <h2>Writing Task</h2>

  <p><b>Task:</b> Some people think technology improves education. Do you agree or disagree?</p>

  <textarea id="essay" placeholder="Write your essay here..."></textarea>

  <button onclick="finish()">Finish Exam</button>
</div>

<script>
function finish() {
  const essay = document.getElementById("essay").value;

  localStorage.setItem("writingAnswer", essay);

  window.location.href = "result.html";
}
</script>

</body>
</html>
