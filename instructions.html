<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Instructions</title>

<style>
body {
  font-family: Arial;
  background: #f5f7fb;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.card {
  background: white;
  padding: 30px;
  border-radius: 10px;
  width: 500px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 15px;
  background: #0a1f44;
  color: white;
  border: none;
  cursor: pointer;
}
</style>

</head>
<body>

<div class="card">
  <h2>Exam Instructions</h2>

  <p>Welcome to IELTS Mock Test.</p>

  <p><b>Order of exam:</b></p>
  <p>1. Reading</p>
  <p>2. Listening</p>
  <p>3. Writing</p>

  <p>You cannot skip sections. Result will be shown at the end.</p>

  <button onclick="startExam()">Start Reading</button>
</div>

<script>
function startExam() {
  window.location.href = "reading.html";
}
</script>

</body>
</html>
